<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ocalc</title>
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
  <header class="bar">
    <a class="brand" href="./">ocalc</a>
    <label>Language
      <select id="language">
        <option value="auto">Auto</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="java">Java</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="csharp">C#</option>
        <option value="go">Go</option>
        <option value="rust">Rust</option>
        <option value="ruby">Ruby</option>
        <option value="php">PHP</option>
        <option value="kotlin">Kotlin</option>
        <option value="swift">Swift</option>
        <option value="scala">Scala</option>
        <option value="lua">Lua</option>
      </select>
    </label>
    <label>Example
      <select id="example"></select>
    </label>
    <label class="file">Open
      <input id="file" type="file" />
    </label>
    <span class="grow"></span>
    <a href="./">Docs</a>
    <a href="https://github.com/Anuj-Attri/ocalc">GitHub</a>
  </header>
  <div class="workspace">
    <div class="editor-pane">
      <div id="editor"></div>
      <footer class="status">
        <span id="cursor">Ln 1, Col 1</span>
        <span id="detected"></span>
        <span>Tab indents · Shift+Tab outdents</span>
      </footer>
    </div>
    <aside class="report" aria-live="polite">
      <h1>Worst case</h1>
      <div class="metrics">
        <div>
          <span class="k">Time</span>
          <strong id="time">…</strong>
          <span id="time-meta" class="meta"></span>
        </div>
        <div>
          <span class="k">Space</span>
          <strong id="space">…</strong>
          <span id="space-meta" class="meta"></span>
        </div>
      </div>
      <table>
        <caption>Functions in this file</caption>
        <thead>
          <tr><th>Function</th><th>Time</th><th>Space</th><th>Why</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="note">The classes above are the worst case in this file, read from loops, recursion, and calls such as matrix products and sorts.</p>
    </aside>
  </div>
  <p id="boot" class="boot">Loading editor…</p>
  <script src="analyze.js"></script>
  <script type="module" src="demo.js"></script>
</body>
</html>
