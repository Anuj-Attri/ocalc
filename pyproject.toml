[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocalc"
version = "0.1.0"
description = "Measure a Python function and comment its time and space complexity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["complexity", "benchmark", "big-o", "profiling"]
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Anuj-Attri/ocalc"
Documentation = "https://anuj-attri.github.io/ocalc/"
Repository = "https://github.com/Anuj-Attri/ocalc"
Issues = "https://github.com/Anuj-Attri/ocalc/issues"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest"]
docs = ["sphinx>=7.2,<8", "pytorch-sphinx-theme2==0.4.13"]

[project.scripts]
ocalc = "ocalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
